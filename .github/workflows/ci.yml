name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python syntax + lint
        run: |
          python -m py_compile gateway/*.py bench/*.py installer/*.py tests/*.py
          pip install --quiet ruff
          ruff check gateway bench installer tests --select E,F,W,B --ignore E501

      - name: Installer unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell scripts
        run: shellcheck setup.sh scripts/*.sh scripts/shura tests/*.sh

      - name: JSON configs are valid
        run: |
          for f in config/*.example.json mcp/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done
          sed "s|@REPO_DIR@|/repo|g" opencode/opencode.json.in | python -m json.tool > /dev/null && echo "ok opencode.json.in"

      - name: MCP filter parses
        run: node --check mcp/mcp-tool-filter.js

      - name: Gateway starts and serves /guardian/status (no GPU, no model)
        run: |
          mkdir -p /tmp/gw && cp config/guardian.example.json /tmp/gw/guardian.json && cp config/model-launch.example.json /tmp/gw/model-launch.json
          AI_GATEWAY_CONFIG=/tmp/gw AI_GATEWAY_STATE=/tmp/gw/state python gateway/ai_gateway.py &
          sleep 2
          curl -sf http://127.0.0.1:8080/guardian/status | python -m json.tool

  distro-packages:
    # Installs the build packages setup.sh would install, in each supported distro, and checks the CUDA repo.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "archlinux:latest", "fedora:44"]
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/repo:ro" "${{ matrix.image }}" bash /repo/tests/distro-packages.sh
