name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python syntax + lint
        run: |
          python -m py_compile gateway/*.py bench/*.py installer/*.py tests/*.py
          pip install --quiet ruff
          ruff check gateway bench installer tests --select E,F,W,B --ignore E501

      - name: Installer unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell scripts
        run: shellcheck setup.sh scripts/*.sh scripts/shura tests/*.sh

      - name: JSON configs are valid
        run: |
          for f in config/*.example.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done

      - name: Gateway starts and serves /guardian/status (no GPU, no model)
        run: |
          mkdir -p /tmp/gw && cp config/guardian.example.json /tmp/gw/guardian.json && cp config/model-launch.example.json /tmp/gw/model-launch.json
          AI_GATEWAY_CONFIG=/tmp/gw AI_GATEWAY_STATE=/tmp/gw/state python gateway/ai_gateway.py &
          sleep 2
          curl -sf http://127.0.0.1:8080/guardian/status | python -m json.tool

  distro-packages:
    # Installs the build packages setup.sh would install, in each supported distro, and checks the CUDA repo.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "archlinux:latest", "fedora:44"]
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/repo:ro" "${{ matrix.image }}" bash /repo/tests/distro-packages.sh

  universal:
    # The universal installer core on every OS we target: unit tests, then a real download and self-test of the CPU
    # build of llama.cpp on a 19 MB model. Proves the detect -> resolve -> download -> run path, not GPU speed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Universal unit tests
        shell: bash
        run: |
          python -m unittest tests.test_universal tests.test_detect tests.test_backends tests.test_cli_report tests.test_engine tests.test_bandwidth tests.test_install -v > unittest.log 2>&1 && code=0 || code=$?
          tail -n 40 unittest.log
          if [ "$code" != 0 ]; then python tests/ci_annotate.py unittest.log; fi
          exit $code
      - name: Hardware check on this runner
        run: python installer/universal/cli.py check --no-measure
        continue-on-error: true   # a plan can legitimately be a refusal on a small runner
      - name: Install dry run (plan, sizes, disk; downloads nothing)
        run: python installer/universal/cli.py install --dry-run --no-measure
        continue-on-error: true
      - name: Self-test the CPU build (download + run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python installer/universal/cli.py selftest --backend cpu

  vulkan-software:
    # The Vulkan build, run on Mesa's software Vulkan (lavapipe) as llama.cpp's own CI does: no GPU needed.
    # Experimental until it has passed a few times, hence continue-on-error.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Self-test the Vulkan build on lavapipe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
        run: python installer/universal/cli.py selftest --backend vulkan

